server:
  port: 8080

spring:
  application:
    name: ousl-cloud-lab-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ousldb}?sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:OuslLabPass2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always